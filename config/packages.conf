# FieldKit package catalog
# Format: action|package|display name|recommendation|reason
# Recommendations are advisory; the installer only changes packages explicitly selected by the user.

# Applications that are reasonable removal candidates on a field workstation.
remove|thunderbird|Thunderbird|REMOVE|Large desktop mail client; optional on a field workstation.
remove|hypnotix|Hypnotix|REMOVE|Streaming TV application; generally unnecessary for field work.
remove|celluloid|Celluloid|REMOVE|Desktop media player; optional on a technician workstation.
remove|rhythmbox|Rhythmbox|REMOVE|Music player; optional on a field workstation.
remove|drawing|Drawing|REMOVE|Simple drawing application; generally unnecessary for field work.
remove|pix|Pix|REMOVE|Desktop image viewer/editor; optional on a technician workstation.
remove|transmission-gtk|Transmission|REMOVE|BitTorrent client; generally unnecessary on a field workstation.
remove|webapp-manager|Web App Manager|REMOVE|Web-app launcher; optional on a technician workstation.
remove|gnome-calendar|GNOME Calendar|REMOVE|Desktop calendar application; optional on a field workstation.
remove|warpinator|Warpinator|KEEP|Useful for quick local file transfers between nearby Linux systems.

# Core field and system utilities.
install|curl|curl|RECOMMENDED|HTTP/HTTPS client used by scripts, diagnostics, and API work.
install|wget|wget|RECOMMENDED|Reliable command-line downloader useful in field environments.
install|git|Git|RECOMMENDED|Version control and deployment tool for configuration and scripts.
install|htop|htop|RECOMMENDED|Interactive process and resource monitor.
install|btop|btop|RECOMMENDED|Modern system resource monitor with a useful terminal interface.
install|nmap|Nmap|RECOMMENDED|Network discovery, port scanning, and service identification.
install|dnsutils|DNS utilities|RECOMMENDED|Provides dig and related DNS troubleshooting tools.
install|traceroute|Traceroute|RECOMMENDED|Path and routing diagnostics.
install|mtr-tiny|MTR|RECOMMENDED|Combines ping and traceroute for live path analysis.
install|iperf3|iperf3|RECOMMENDED|Bandwidth and network performance testing.
install|tcpdump|tcpdump|RECOMMENDED|Command-line packet capture and analysis.
install|ethtool|ethtool|RECOMMENDED|Ethernet interface diagnostics and link information.
install|lshw|lshw|RECOMMENDED|Hardware inventory and identification.
install|smartmontools|smartmontools|RECOMMENDED|SMART storage health monitoring.
install|pciutils|PCI utilities|RECOMMENDED|PCI hardware identification with lspci.
install|usbutils|USB utilities|RECOMMENDED|USB hardware identification with lsusb.
install|openssh-client|OpenSSH client|RECOMMENDED|SSH access to routers, switches, servers, and other hosts.
install|openssh-server|OpenSSH server|RECOMMENDED|Allows secure remote SSH administration of the FieldKit workstation.
install|rsync|rsync|RECOMMENDED|Efficient file transfer and synchronization.
install|jq|jq|RECOMMENDED|Command-line JSON parsing for APIs and automation.
install|tailscale|Tailscale|RECOMMENDED|Secure mesh VPN for remote access to field systems without exposing SSH or VNC directly to the internet.

# Useful but less universally required field applications.
install|whois|whois|OPTIONAL|Domain registration and ownership lookup.
install|remmina|Remmina|OPTIONAL|Graphical RDP/VNC/remote administration client.
install|gsmartcontrol|GSmartControl|OPTIONAL|Graphical interface for SMART drive diagnostics.
