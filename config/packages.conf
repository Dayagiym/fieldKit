# FieldKit package catalog
# Format: action|package|display name|recommendation|reason|source
# Recommendations: RECOMMENDED, OPTIONAL, REMOVE, KEEP
# Sources: apt (normal Mint/Ubuntu repositories), external:<vendor> (vendor-managed)

# Applications that are reasonable removal candidates on a field workstation.
remove|thunderbird|Thunderbird|REMOVE|Large desktop mail client; optional on a field workstation.|apt
remove|hypnotix|Hypnotix|REMOVE|Streaming TV application; generally unnecessary for field work.|apt
remove|celluloid|Celluloid|REMOVE|Desktop media player; optional on a technician workstation.|apt
remove|rhythmbox|Rhythmbox|REMOVE|Music player; optional on a field workstation.|apt
remove|drawing|Drawing|REMOVE|Simple drawing application; generally unnecessary on a field workstation.|apt
remove|pix|Pix|REMOVE|Desktop image viewer/editor; optional on a technician workstation.|apt
remove|transmission-gtk|Transmission|REMOVE|BitTorrent client; generally unnecessary on a field workstation.|apt
remove|webapp-manager|Web App Manager|REMOVE|Web-app launcher; optional on a technician workstation.|apt
remove|gnome-calendar|GNOME Calendar|REMOVE|Desktop calendar application; optional on a field workstation.|apt
remove|gimp|GIMP|REMOVE|Large raster image editor; generally unnecessary on a dedicated field workstation.|apt
remove|inkscape|Inkscape|REMOVE|Vector graphics editor; generally unnecessary on a dedicated field workstation.|apt
remove|warpinator|Warpinator|KEEP|Useful for quick local file transfers between nearby Linux systems.|apt

# Core field and system utilities.
install|curl|curl|RECOMMENDED|HTTP/HTTPS client used by scripts, diagnostics, and API work.|apt
install|wget|wget|RECOMMENDED|Reliable command-line downloader useful in field environments.|apt
install|git|Git|RECOMMENDED|Version control and deployment tool for configuration and scripts.|apt
install|htop|htop|RECOMMENDED|Interactive process and resource monitor.|apt
install|btop|btop|RECOMMENDED|Modern system resource monitor with a useful terminal interface.|apt
install|nmap|Nmap|RECOMMENDED|Network discovery, port scanning, and service identification.|apt
install|dnsutils|DNS utilities|RECOMMENDED|Provides dig and related DNS troubleshooting tools.|apt
install|traceroute|Traceroute|RECOMMENDED|Path and routing diagnostics.|apt
install|mtr-tiny|MTR|RECOMMENDED|Combines ping and traceroute for live path analysis.|apt
install|iperf3|iperf3|RECOMMENDED|Bandwidth and network performance testing.|apt
install|tcpdump|tcpdump|RECOMMENDED|Command-line packet capture and analysis.|apt
install|ethtool|ethtool|RECOMMENDED|Ethernet interface diagnostics and link information.|apt
install|lshw|lshw|RECOMMENDED|Hardware inventory and identification.|apt
install|smartmontools|smartmontools|RECOMMENDED|SMART storage health monitoring.|apt
install|pciutils|PCI utilities|RECOMMENDED|PCI hardware identification with lspci.|apt
install|usbutils|USB utilities|RECOMMENDED|USB hardware identification with lsusb.|apt
install|openssh-client|OpenSSH client|RECOMMENDED|SSH access to routers, switches, servers, and other hosts.|apt
install|openssh-server|OpenSSH server|RECOMMENDED|Allows secure remote SSH administration of the FieldKit workstation.|apt
install|rsync|rsync|RECOMMENDED|Efficient file transfer and synchronization.|apt
install|jq|jq|RECOMMENDED|Command-line JSON parsing for APIs and automation.|apt
install|tailscale|Tailscale|RECOMMENDED|Secure mesh VPN for remote access to field systems without exposing SSH or VNC directly to the internet.|external:tailscale
install|wifiman|WiFiman|RECOMMENDED|Ubiquiti network discovery, Wi-Fi analysis, speed testing, and UniFi diagnostics.|external:ubiquiti
install|drawio|draw.io|RECOMMENDED|Technical diagramming tool useful for network topologies, floor plans, rack layouts, and field documentation.|external:drawio

# Useful but less universally required field applications.
install|whois|whois|OPTIONAL|Domain registration and ownership lookup.|apt
install|remmina|Remmina|OPTIONAL|Graphical RDP/VNC/remote administration client.|apt
install|gsmartcontrol|GSmartControl|OPTIONAL|Graphical interface for SMART drive diagnostics.|apt
